<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Ward · Respiro</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/favicon.png?v=2" type="image/png">
</head>
<body data-title="Ward">
  <a class="skip" href="#main">Skip to content</a>
  <header class="top" id="chrome"><a class="brand" href="/"><img src="/static/logo.png" alt="Respiro"></a></header>
  <main class="wrap" id="main">
    <div class="ward-head">
      <div>
        <h1>Ward</h1>
        <p class="lede" id="lede">Admitted patients, highest alert tier first.</p>
      </div>
      <div class="shift-stat" id="shift-stat">
        <p class="fine" id="shift-label">This shift</p>
        <p class="shift-stat__nums" id="shift-counts">—</p>
        <p class="fine" id="shift-rates" hidden></p>
      </div>
    </div>
    <div class="tier-filters" id="tiers" role="toolbar" aria-label="Filter by status"></div>
    <div class="board" id="board" aria-label="Patient census"></div>
  </main>
  <footer class="footer">Research prototype — not a medical device. Thresholds are for demonstration.</footer>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
