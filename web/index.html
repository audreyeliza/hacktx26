<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Ward · BreathWatch</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' rx='3' fill='none' stroke='%231d5c54' stroke-width='1.5'/%3E%3Cpath d='M3 9.2c1.1-2 2.1-2 3.1 0s2 2 3.1 0 2.1-2 3.2 0' fill='none' stroke='%231d5c54' stroke-width='1.2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">

<body data-title="Ward">
  <a class="skip" href="#main">Skip to content</a>
  <header class="top" id="chrome"><a class="brand" href="/">BreathWatch</a></header>
  <main class="wrap" id="main">
    <div class="ward-head">
      <div>
        <h1>Ward</h1>
        <p class="lede" id="lede">Admitted patients, highest alert tier first.</p>
      </div>
      <div class="shift-stat" id="shift-stat">
        <p class="fine" id="shift-label">This shift</p>
        <p class="shift-stat__nums"><b id="smart-n">—</b> smart alarms <span>vs <b id="std-n">—</b> standard</span></p>
      </div>
    </div>
    <div class="tier-filters" id="tiers" role="toolbar" aria-label="Filter by status"></div>
    <div class="board" id="board" aria-label="Patient census"></div>
  </main>
  <footer class="footer">Research prototype — not a medical device. Thresholds are for demonstration.</footer>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
