<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Sign in · Respiro</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/favicon.png?v=2" type="image/png">
</head>
<body class="login" data-title="Sign in">
  <main class="login-card">
    <h1 class="brand-logo"><img src="/static/logo.png" alt="Respiro"></h1>
    <p class="lede">Continuous breathing watch for the post-surgical ward.</p>
    <p class="notice">Demo accounts — do not use real credentials.</p>
    <div class="demo-grid" id="demo"></div>
    <form id="login-form">
      <div id="password-fields">
        <label>Username <input name="username" autocomplete="username" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <div class="form-actions"><button class="primary" type="submit">Sign in</button></div>
      </div>
      <p class="notice" id="login-error" hidden></p>
    </form>
  </main>
  <footer class="footer">Research prototype — not a medical device. Thresholds are for demonstration.</footer>
  <script type="module" src="/static/login.js"></script>
</body>
</html>
