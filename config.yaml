# BreathWatch configuration. All tunable numbers live here.
# Every threshold is a DEMO value for a research prototype, not a clinical value.

contract:                  # AGENTS.md section 4 (do not change without updating AGENTS.md)
  version: 1
  sample_rate_hz: 50
  dt_ms: 20
  batch_samples: 25        # one packet every 0.5 s
  max_samples: 100         # validator upper bound per packet
  adc_max: 65535
  accel_max_g: 2.0         # MMA8452Q at +/-2 g
  max_datagram_bytes: 1400 # stay below a typical UDP MTU so packets never fragment

network:
  server_ip: 10.42.0.1     # where the Pico sends UDP; set to the Mac's IP on a phone hotspot
  http_host: 0.0.0.0       # all interfaces, so phones on the same network can open the dashboard
  http_port: 8000
  udp_host: 0.0.0.0
  udp_port: 5005
  command_port: 5006
  serial_baud: 115200

ingest:
  default_source: udp      # udp | serial:auto | serial:/dev/cu.usbmodemXXXX | simulator:<scenario>
  default_speed: 1.0       # simulator playback speed for the in-process source
  buffer_s: 600            # ring buffer length per channel (10 min)
  restart_seq_back: 4      # seq this far behind the newest = device restarted (re-anchor)
  serial_reconnect_s: 1.0
  serial_read_timeout_s: 0.2
  serial_max_line_bytes: 8192
  serial_pico_vid: 0x2E8A  # Raspberry Pi USB vendor id (Pico)
  link_timeout_s: 3.0      # no packet for this long = link lost

live:                      # WebSocket push to the dashboard
  push_hz: 10
  wave_decimate: 2         # 50 Hz -> 25 Hz for display
  wave_window_s: 30
  status_interval_s: 1.0
  trend_window_s: 3600

simulator:
  seed: 42
  device: patch-01
  ticks_wrap: 1073741824   # MicroPython rp2 ticks_ms period (2**30)
  start_ticks_ms: 5210000
  # Raw-signal shape (ADC counts unless noted)
  pressure_dc: 31000
  pressure_amp: 2400
  pressure_noise: 60
  pressure_drift_amp: 300
  pressure_drift_hz: 0.008
  therm_dc: 40000
  therm_amp: 1100
  therm_noise: 25
  therm_lag_s: 0.35        # airflow lags effort
  therm_tau_s: 0.45        # thermistor first-order response
  therm_ambient: 36500     # reading when the thermistor is off the face
  pulse_dc: 28000
  pulse_amp: 3200
  pulse_noise: 80
  accel_breath_g: 0.006    # breathing-induced tilt at the sternum
  accel_noise_g: 0.002
  motion_accel_g: 0.35     # burst amplitude during motion artifacts
  motion_pressure_amp: 9000
  motion_therm_amp: 2500
  envelope_tau_s: 0.8      # smoothing of effort/airflow amplitude changes
  apnea_residual: 0.03     # fraction of amplitude left in a "flat" channel
  hypopnea_level: 0.4
  hr_bpm: 70
  hr_wobble_bpm: 2         # slow heart-rate variability
  hr_wobble_period_s: 20
  pulse_resp_mod: 300      # respiratory baseline modulation of the PPG
  rr_wobble_bpm: 1.0       # normal breathing wanders 14-16/min
  rr_wobble_period_s: 180
  breath_skew: 0.35        # inspiration faster than expiration
  labels_dir: data/sim_labels

signals:
  filter_order: 2
  resp_band_hz: [0.05, 1.0]   # decided: 0.05 (not 0.1) so 6/min is not at the -3 dB corner
  pulse_band_hz: [0.7, 3.5]
  motion_highpass_hz: 1.5
  motion_rms_window_s: 2
  rate_interval_s: 5
  rate_window_s: 60           # reported rate
  prelim_window_s: 30         # display-only preliminary estimate
  hr_window_s: 15
  min_valid_fraction: 0.8     # fraction of non-NaN samples a window needs
  rr_min_bpm: 3
  rr_max_bpm: 40
  hr_min_bpm: 35
  hr_max_bpm: 180
  peak_prominence_frac: 0.3   # breath peaks must exceed this fraction of the window's robust amplitude
  min_intervals: 2            # peak-to-peak intervals needed for a rate
  interval_cv_max: 0.5        # interval irregularity (coef. of variation) at which confidence hits 0
  fft_pad_factor: 8           # zero padding for a finer FFT frequency grid
  fft_confirm_bpm: 2.0        # peak-rate vs FFT-rate agreement for full confidence
  source_min_conf: 0.3        # a source below this confidence is not used for fusion
  agree_bpm: 3.0              # sources within this of each other are "agreeing"
  single_source_conf_cap: 0.6 # decided: one clean source still meets the alert gate
  disagree_conf_cap: 0.4      # 2+ sources and none agree: best one is shown, below the alert gate
  flat_std_counts: 40         # a channel with lower filtered std carries no breathing signal
  accel_min_breath_g: 0.0015  # minimum accel-effort std to report rr_accel

quality:                      # v0 rules (AGENTS.md section 7); per 10 s segment
  window_s: 10
  min_valid_fraction: 0.5     # less valid data than this -> "unknown"
  flat_raw_std_counts: 15     # dead-flat channel (must stay below an apnea's residual signal)
  clip_margin_counts: 64      # this close to 0 or 65535 counts as clipped
  clip_fraction: 0.2          # clipped samples above this fraction -> sensor_off
  motion_threshold_g: 0.03    # max 2 s RMS of high-passed accel magnitude
  disagree_conf: 0.5          # clean, but belt and accel rates disagree by > signals.agree_bpm
  sensor_off_conf: 0.9
  posture_min_g: 0.6          # gravity component needed to name a posture
  model_path: data/quality_model.joblib   # v1 (milestone 9); v0 rules if missing

events:                       # AGENTS.md section 7 (Events); amplitudes relative to baseline
  point_s: 1.0                # resolution of the event state machine
  lag_s: 12.0                 # a second is final this far behind the newest sample (edge effects)
  provisional_lag_s: 1.0      # seconds up to here are evaluated provisionally for "apnea in progress"
  watch_interval_s: 1.0       # the apnea watch runs this often (vitals stay every 5 s)
  env_smooth_s: 1.0           # moving average on the Hilbert envelope
  edge_pad_s: 10              # reflective padding before filtering / Hilbert
  baseline_window_s: 120      # baseline = median amplitude over this much normal, valid data
  baseline_min_s: 30          # no events until this much baseline data exists
  apnea_frac: 0.10            # airflow < 10 % of baseline
  hypopnea_frac: 0.70         # airflow < 70 % of baseline
  min_event_s: 10
  edge_trim_s: 2              # seconds trimmed at each end of an event before taking medians
  max_event_s: 120            # a "low" run longer than this is closed (likely a sensor problem)
  obstructive_effort_frac: 0.30
  central_effort_frac: 0.20
  clear_conf: 0.9             # confidence when the effort ratio is clearly on one side
  ambiguous_conf: 0.5         # effort between the central and obstructive limits
  recent_max: 200             # events kept in memory per patient

alerts:                       # AGENTS.md section 8 — DEMO values, not clinical
  gate_quality_conf: 0.6      # only quality "clean" with confidence >= this can raise tier >= 1
  gate_rr_conf: 0.6           # rr-based rules also need rr_conf >= this
  rr_tier1_below: 10
  rr_tier1_persist_s: 60
  rr_tier2_below: 8
  rr_tier2_persist_s: 60
  rr_tier3_below: 6
  rr_tier3_persist_s: 30
  baseline_window_s: 600      # patient baseline rr = median of the first 10 min (clean data)
  baseline_min_s: 120         # until then: median since admission once this much exists
  trend_drop_frac: 0.30       # rr >= 30 % below baseline ...
  trend_window_s: 1800        # ... and the drop happened within 30 min ...
  trend_recent_frac: 0.9      # ... i.e. rr was >= 90 % of baseline somewhere in that window
  trend_persist_s: 30
  apnea_tier1_s: 10
  apnea_tier3_s: 20
  cluster_count: 5
  cluster_window_s: 900
  sensor_off_s: 60            # sensor off this long -> tier 1 "check sensor"
  cooldown_s: 120             # same kind not re-raised within this unless the tier increases
  escalate_s: 60              # tier 3 not acknowledged this long -> escalated (charge nurse)
  latch_tier: 2               # alerts at/above this tier stay active until acknowledged
  clear_s: 30                 # a non-latching alert resolves after its condition is clear this long
  conf_high: 0.8              # wording in reasons: "signal confidence high" at/above this

naive:                        # the comparison monitor: fixed thresholds, no gating/persistence/cooldown
  rr_low: 8
  rr_high: 25
  hr_low: 50
  hr_high: 120
  flat_s: 10                  # airflow flat this long
  flat_std_counts: 150        # band-passed thermistor std below this = "flat"
  rr_window_s: 15
  hr_window_s: 10
  peak_prominence_counts: 200 # fixed peak threshold, raw ADC counts
  rr_min_gap_s: 1.0
  hr_min_gap_s: 0.3

bedside:
  command_interval_s: 2       # resend the LED/buzzer status this often (Pico blinks blue after 10 s)

store:
  path: data/breathwatch.db

auth:                         # AGENTS.md §19 — DEMO-GRADE login
  enabled: true
  cookie_name: bw_session
  session_ttl_h: 12
  accounts:                   # DEMO ONLY — never real credentials
    - {username: nurse, display_name: Demo Nurse, role: nurse, password: demo}
    - {username: doctor, display_name: Demo Physician, role: physician, password: demo}
    - {username: admin, display_name: Demo Admin, role: admin, password: demo}

ward:
  live_device_id: patch-01
  random_offset: true         # simulated patients start at a random point in their scenario
  ward_push_s: 2.0            # /ws/ward summary push at most this often
  backfill_s: 150             # on ward start/reset, simulated beds get this much history at once
  seed:                       # created when the patients table is empty; names are fictional
    - bed: "1"
      name: Morgan Ellis
      device: {kind: simulator, scenario: normal}
      risk_factors: {opioids: true, supplemental_o2: false, osa: none, age_over_65: false}
      notes: Post-op day 2, oral opioids
    - bed: "2"
      name: Riley Chen
      device: {kind: simulator, scenario: motion}
      risk_factors: {opioids: true, supplemental_o2: false, osa: none, age_over_65: true}
      notes: Restless overnight
    - bed: "3"
      name: Sam Okafor
      device: {kind: simulator, scenario: obstructive}
      risk_factors: {opioids: true, supplemental_o2: true, osa: suspected, age_over_65: false}
      notes: Snoring reported, STOP-BANG 5
    - bed: "4"
      name: Jordan Avery
      device: {kind: live, device_id: patch-01}
      risk_factors: {opioids: true, supplemental_o2: true, osa: suspected, age_over_65: false}
      notes: Post-op day 1, PCA morphine (live wearable)
    - bed: "5"
      name: Casey Moreno
      device: {kind: simulator, scenario: opioid_decline}
      risk_factors: {opioids: true, supplemental_o2: true, osa: none, age_over_65: true}
      notes: PCA dose increased at 22:00
    - bed: "6"
      name: Alex Novak
      device: {kind: simulator, scenario: central}
      risk_factors: {opioids: true, supplemental_o2: false, osa: known, age_over_65: true}
      notes: Home CPAP not available

record:
  dir: data/recordings
  labels: [clean, motion, sensor_off, slow_breathing, breath_hold_effort, breath_hold_no_effort]

llm:                          # AGENTS.md §10 — Google Gemini; key from the environment only
  provider: gemini            # gemini | fake (tests / offline development)
  model: gemini-3.8-flash     # fast model for explanations and the overnight summary
  handoff_model: gemini-3.8-flash   # optionally a stronger model for the SBAR note
  api_key_env: GEMINI_API_KEY
  timeout_s: 20
  temperature: 0.2
  max_output_tokens: 1200
  explain_window_s: 900       # data around an alert for "explain"
  overnight_window_s: 43200   # at most the last 12 h for overnight / handoff
  max_events_listed: 15
  max_alerts_listed: 15
  notes_max_chars: 300
